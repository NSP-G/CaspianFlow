[package]
name = "caspian-flow"
version = "0.1.0"
edition = "2024"
authors = ["CaspianFlow Team"]
license = "MIT OR Apache-2.0"
description = "A local-first Agent platform with dignity and sovereignty"
repository = "https://github.com/your-org/CaspianFlow"
homepage = "https://caspianflow.dev"
documentation = "https://caspianflow.dev/docs"
readme = "README.md"

[dependencies]
# DAG topology
petgraph = "0.6"

# SQLite
rusqlite = { version = "0.32", features = ["bundled"] }

# UUID
uuid = { version = "1", features = ["v4"] }

# Date handling
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# HTTP client (rustls to avoid OpenSSL on Android)
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Async runtime + async-trait for dyn-compatible async traits
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Path / file / system
dirs = "6.0"
notify = "7.0"
parking_lot = "0.12"

# Optional jemalloc allocator
tikv-jemallocator = { version = "0.6", optional = true }

# Tauri
tauri = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true, default-features = false, features = ["rustls-tls"] }

[build-dependencies]
tauri-build = { version = "2", optional = true }

[features]
default = []
tauri = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-updater"]
jemalloc = ["dep:tikv-jemallocator"]

[dev-dependencies]
pretty_assertions = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(target_os = "android")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
