name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: caspianflow.AppImage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: caspianflow.msi
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: caspianflow.dmg

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install pnpm
        run: |
          npm install -g pnpm
          echo "$(npm prefix -g)/bin" >> $GITHUB_PATH
          echo "export PATH=\"$(npm prefix -g)/bin:\$PATH\"" >> $GITHUB_ENV

      - name: Verify pnpm
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install

      - name: Build Tauri app
        run: pnpm tauri build --features tauri -- --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**/*

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: aarch64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;26.1.10909125

      - name: Install pnpm
        run: |
          npm install -g pnpm
          echo "$(npm prefix -g)/bin" >> $GITHUB_PATH
          echo "export PATH=\"$(npm prefix -g)/bin:\$PATH\"" >> $GITHUB_ENV

      - name: Verify pnpm
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install

      - name: Initialize Tauri Android
        run: pnpm tauri android init

      - name: Build APK
        run: pnpm tauri android build -- --apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: caspianflow.apk
          path: gen/android/app/build/outputs/apk/**/*.apk
