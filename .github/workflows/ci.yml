# Headless CI gate — mirrors the local sandbox gate.
#
# Runs the same checks Keel runs in the sandbox so regressions are caught
# before a release build: Rust tests (lib + integration + doctests, default
# features, NO Tauri GUI — so no webkit2gtk needed) + frontend build /
# typecheck / lint.
#
# Deliberately does NOT run `tauri build`: that needs the webview system
# libraries and is covered by .github/workflows/release.yml on tagged pushes.
#
# Layout note: the app lives at the repository ROOT (not a monorepo
# subdirectory), so there is no `working-directory` prefix here.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Linux system deps (keyring -> dbus)
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Run tests (lib + integration + doctests, no GUI)
        id: rust_tests
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml 2>&1 | tee cargo-test.log
      # Surface the actual failure text as check annotations, so a red CI can be
      # triaged from the PR "Files changed" / checks view without opening logs.
      - name: Surface test failures as annotations
        if: always() && steps.rust_tests.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import re, os, traceback
          def emit(tag, text):
              print("::error::===== " + tag + " =====")
              print("::error::" + text.replace("\n", "%0A")[:3500])
          try:
              path = os.environ.get("LOG_FILE", "cargo-test.log")
              if not os.path.exists(path):
                  emit("no log", "cargo-test.log was not produced")
                  raise SystemExit(0)
              txt = re.sub(r"\x1b\[[0-9;]*m", "", open(path, encoding="utf-8", errors="replace").read())
              lines = txt.splitlines()
              idx = [i for i, l in enumerate(lines) if re.match(r"^(error|warning)(\[|:)", l)]
              if idx:
                  emit("first error block", "\n".join(lines[max(0, idx[0]-2):idx[0]+45]))
              fai = [i for i, l in enumerate(lines) if l.strip() == "failures:"]
              if fai:
                  emit("failing tests", "\n".join(lines[fai[-1]:fai[-1]+30]))
              so = [i for i, l in enumerate(lines) if re.match(r"^---- .* stdout ----$", l)]
              for s in so[:3]:
                  emit("panic output", "\n".join(lines[s:s+40]))
              if not idx and not fai and not so:
                  emit("raw tail", "\n".join(lines[-80:]))
          except SystemExit:
              raise
          except Exception:
              emit("annotator crashed", traceback.format_exc())
          PY
      - name: Clippy (lib + tests)
        id: clippy
        run: |
          set -o pipefail
          cargo clippy --lib --tests --manifest-path src-tauri/Cargo.toml -- -D warnings 2>&1 | tee clippy.log
      - name: Surface clippy failures as annotations
        if: always() && steps.clippy.outcome == 'failure'
        env:
          LOG_FILE: clippy.log
        run: |
          python3 - <<'PY'
          import re, os, traceback
          def emit(tag, lines):
              print("::error::===== " + tag + " =====")
              print("::error::" + "%0A".join(lines)[:3500])
          try:
              path = os.environ.get("LOG_FILE", "clippy.log")
              if not os.path.exists(path):
                  emit("no log", [path + " was not produced"])
                  raise SystemExit(0)
              txt = re.sub(r"\x1b\[[0-9;]*m", "", open(path, encoding="utf-8", errors="replace").read())
              lines = txt.splitlines()
              errs = [i for i, l in enumerate(lines) if re.match(r"^error(\[|:)", l)]
              if errs:
                  emit("first clippy error", lines[max(0, errs[0]-2):errs[0]+40])
                  locs = []
                  for i in errs:
                      locs.append(lines[i].strip()[:100])
                      for j in range(i+1, min(i+4, len(lines))):
                          if lines[j].strip().startswith("-->"):
                              locs.append("    " + lines[j].strip()[:100]); break
                  emit("all error locations (%d)" % len(errs), locs[:80])
              else:
                  emit("raw tail", lines[-80:])
          except SystemExit:
              raise
          except Exception:
              emit("annotator crashed", traceback.format_exc().splitlines())
          PY

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
