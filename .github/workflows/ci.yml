# Headless CI gate — mirrors the local sandbox gate.
#
# Runs the same checks Keel runs in the sandbox so regressions are caught
# before a release build: Rust tests (lib + integration + doctests, default
# features, NO Tauri GUI — so no webkit2gtk needed) + frontend build /
# typecheck / lint.
#
# Deliberately does NOT run `tauri build`: that needs the webview system
# libraries and is covered by .github/workflows/release.yml on tagged pushes.
#
# Layout note: the app lives at the repository ROOT (not a monorepo
# subdirectory), so there is no `working-directory` prefix here.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Run tests (lib + integration + doctests, no GUI)
        id: rust_tests
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml 2>&1 | tee cargo-test.log
      # Surface the actual failure text as check annotations, so a red CI can be
      # triaged from the PR "Files changed" / checks view without opening logs.
      - name: Surface test failures as annotations
        if: always() && steps.rust_tests.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import re, os, subprocess
          path = "cargo-test.log"
          if not os.path.exists(path):
              print("::error::cargo-test.log was not produced")
              raise SystemExit(0)
          raw = open(path, encoding="utf-8", errors="replace").read()
          txt = re.sub(r"\x1b\[[0-9;]*m", "", raw)
          lines = txt.splitlines()
          # Emit the first compiler-error block (plus its notes) as ONE annotation.
          idx = [i for i, l in enumerate(lines) if re.match(r"^(error|warning)(\[|:)", l)]
          if idx:
              s = max(0, idx[0] - 2)
              chunk = lines[s:s + 45]
              msg = "%0A".join(chunk)
              print("::error::===== first error block =====")
              print("::error::" + msg[:3500])
          else:
              print("::error::===== no compile error line; raw tail =====")
              msg = "%0A".join(lines[-60:])
              print("::error::" + msg[:3500])
          PY
      - name: Clippy (lib + tests)
        run: cargo clippy --lib --tests --manifest-path src-tauri/Cargo.toml -- -D warnings

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
